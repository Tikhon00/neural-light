name: Firmware and web installer

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'installer/**'
      - 'scripts/export-firmware.py'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'installer/**'
      - 'scripts/export-firmware.py'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Receiver tests, ESP32 image and installer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - run: python -m pip install -r firmware/requirements.txt
      - run: npm ci
      - run: npm run firmware:test
      - run: npm run firmware:build
      - run: npm run firmware:export
      - run: npm run installer:build
      - run: npx playwright install --with-deps chromium
      # Browser checks never request a serial port or flash a device.
      - run: npm run installer:test
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload installer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: installer/dist

  deploy:
    name: Publish installer
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
